name: ci
on: [push, pull_request]
jobs:
  host:
    # The host side alone: the host dialect compiles prims.lisp and demo.lisp to Forth.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y sbcl
      - run: sbcl --script host.lisp compile prims.lisp
      - run: sbcl --script host.lisp compile demo.lisp
  stm32:
    # The whole stack on the STM32F446 target in QEMU, with this core checked out beside it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: forthlisp }
      - uses: actions/checkout@v4
        with: { repository: equwal/forthlisp-stm32, path: forthlisp-stm32 }
      - run: sudo apt-get update && sudo apt-get install -y sbcl qemu-system-arm binutils-arm-none-eabi
      - run: cd forthlisp-stm32 && sh test.sh
